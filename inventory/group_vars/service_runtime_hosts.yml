---
# Service runtime hosts: machines that run containers/services

allow_reboot: true

# system_host role: Docker/app runtime
system_host_install_docker: true

system_host_deploy_user: "{{ deploy_user }}"
system_host_docker_users:
  - "{{ deploy_user }}"

system_host_app_root: /opt/apps
system_host_app_root_owner: root
system_host_app_root_group: root
system_host_app_root_mode: "0755"

# Portable server packages
server_system_packages: []

# Debian-only extras
server_system_packages_debian:
  - ripgrep
  - ranger
  - ttf-mscorefonts-installer

# Keep RedHat extras conservative until repos/EPEL are configured.
server_system_packages_redhat: []
