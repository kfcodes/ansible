---
ansible_python_interpreter: /usr/bin/python3
system_timezone: "Europe/Dublin"

ssh_key_dir: "{{ lookup('env','HOME') }}/.ssh"
ssh_key_type: ed25519
ssh_key_comment: "Managed by Ansible"

# ----------------------------------------
# Connection targeting
# ----------------------------------------
connection_mode: "ip"

ansible_host: >-
  {{
    host_ip if (connection_mode == 'ip' and host_ip is defined and host_ip | length > 0)
    else system_hostname if (system_hostname is defined and system_hostname | length > 0)
    else inventory_hostname
  }}

# ----------------------------------------
# Bootstrap vs normal automation user
# ----------------------------------------
# User that can password-login to a fresh host during first contact.
bootstrap_user: "m"

# Long-term automation user created by configure_security.yml.
deploy_user: "appuser"

# Normal runs use deploy_user by default.
ansible_user: "{{ deploy_user }}"

# Normal runs use deploy_user's private key on the controller.
ansible_ssh_private_key_file: "{{ ssh_key_dir }}/{{ deploy_user }}"

# -----------------------
# User management defaults
# -----------------------
user_defaults:
  state: present
  shell: /bin/bash
  create_home: true
  system: false
  password_lock: false
  groups:
    - users
  append_groups: false
  exclusive_keys: true
  passwordless_sudo: false

# Admin group differs by OS family:
# Debian/Ubuntu/Pop!_OS: sudo
# Fedora/Rocky/RHEL: wheel
linux_admin_group: "{{ 'wheel' if ansible_os_family | default('Debian') == 'RedHat' else 'sudo' }}"
