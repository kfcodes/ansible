---
- name: Ensure user .ssh directory exists
  ansible.builtin.file:
    path: "{{ system_dev_home }}/.ssh"
    state: directory
    owner: "{{ system_dev_user }}"
    group: "{{ system_dev_user }}"
    mode: "0700"

- name: Check GitHub SSH private key exists
  ansible.builtin.stat:
    path: "{{ system_dev_home }}/.ssh/{{ system_dev_github_ssh_key }}"
  register: system_dev_github_private_key

- name: Fail if GitHub SSH private key is missing
  ansible.builtin.fail:
    msg: "Missing GitHub SSH private key: {{ system_dev_home }}/.ssh/{{ system_dev_github_ssh_key }}"
  when:
    - system_dev_github_ssh_require_key | bool
    - not system_dev_github_private_key.stat.exists

- name: Set GitHub SSH private key permissions
  ansible.builtin.file:
    path: "{{ system_dev_home }}/.ssh/{{ system_dev_github_ssh_key }}"
    owner: "{{ system_dev_user }}"
    group: "{{ system_dev_user }}"
    mode: "0600"
  when: system_dev_github_private_key.stat.exists

- name: Check GitHub SSH public key exists
  ansible.builtin.stat:
    path: "{{ system_dev_home }}/.ssh/{{ system_dev_github_ssh_key }}.pub"
  register: system_dev_github_public_key

- name: Set GitHub SSH public key permissions
  ansible.builtin.file:
    path: "{{ system_dev_home }}/.ssh/{{ system_dev_github_ssh_key }}.pub"
    owner: "{{ system_dev_user }}"
    group: "{{ system_dev_user }}"
    mode: "0644"
  when: system_dev_github_public_key.stat.exists

- name: Ensure user SSH config exists
  ansible.builtin.file:
    path: "{{ system_dev_home }}/.ssh/config"
    state: touch
    owner: "{{ system_dev_user }}"
    group: "{{ system_dev_user }}"
    mode: "0600"

- name: Configure github.com SSH host
  ansible.builtin.blockinfile:
    path: "{{ system_dev_home }}/.ssh/config"
    create: true
    owner: "{{ system_dev_user }}"
    group: "{{ system_dev_user }}"
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - github.com ssh"
    block: |
      Host {{ system_dev_github_ssh_host }}
          HostName {{ system_dev_github_ssh_hostname }}
          User {{ system_dev_github_ssh_user }}
          IdentityFile ~/.ssh/{{ system_dev_github_ssh_key }}
          IdentitiesOnly yes
