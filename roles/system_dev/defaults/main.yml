---
# Target local development user
system_dev_user: "{{ local_usr | default(ansible_user_id | default(lookup('env', 'USER'))) }}"
system_dev_home: "/home/{{ system_dev_user }}"

# Git identity
system_dev_git_user_name: "kfcodes"
system_dev_git_user_email: "+kfcodes@users.noreply.github.com"
system_dev_git_editor: "vim"
system_dev_git_merge_tool: "vimdiff"

# GitHub SSH config
system_dev_github_ssh_enabled: true
system_dev_github_ssh_host: github.com
system_dev_github_ssh_hostname: github.com
system_dev_github_ssh_user: git
system_dev_github_ssh_key: github_key
system_dev_github_rewrite_https_to_ssh: true

# Development repositories
dev_repositories:
  - { repo: "git@github.com:kfcodes/neovim.git", dest: ".nvim" }
  - { repo: "git@github.com:kfcodes/dotfiles.git", dest: ".dotfiles" }
  - { repo: "git@github.com:kfcodes/bash_scripts.git", dest: ".local/bin" }
  - { repo: "git@github.com:kfcodes/docker_scripts.git", dest: ".docker_scripts" }
  - { repo: "git@github.com:kfcodes/ansible.git", dest: ".my_ansible" }
  - { repo: "git@github.com:kfcodes/dmenu.git", dest: ".suckless/dmenu" }
  - { repo: "git@github.com:kfcodes/dwm.git", dest: ".suckless/dwm" }
  - { repo: "git@github.com:kfcodes/reactapp.git", dest: ".reactapp", version: "dev" }
  - { repo: "git@github.com:kfcodes/fastapi.git", dest: ".fastapi", version: "dev" }
  - { repo: "https://github.com/tmux-plugins/tpm", dest: ".tmux/plugins/tpm" }

# Directories needed before linking/configuring
application_directories:
  - { path: ".config", attrs: "0755" }
  - { path: ".config/mpv", attrs: "0755" }
  - { path: ".tmux", attrs: "0755" }
  - { path: ".tmux/plugins", attrs: "0755" }
  - { path: ".suckless", attrs: "0755" }
  - { path: ".local", attrs: "0755" }

# Dotfile links
# required=false means skip if source is missing
dotfile_links:
  - { src: ".dotfiles/dircolors", dest: ".dircolors", required: true }
  - { src: ".dotfiles/Xresources", dest: ".Xresources", required: true }
  - { src: ".dotfiles/xsession", dest: ".xsession", required: true }
  - { src: ".dotfiles/inputrc", dest: ".inputrc", required: true }
  - { src: ".dotfiles/mpv.conf", dest: ".config/mpv/mpv.conf", required: false }
  - { src: ".dotfiles/tmux.conf", dest: ".tmux.conf", required: true }
  - { src: ".nvim", dest: ".config/nvim", required: true }

# Environment file links
env_links:
  - { src: ".application/app_control/env_vars/reactApp.env", dest: ".reactapp/.env", required: false }
  - { src: ".application/app_control/env_vars/fastAPI.env", dest: ".fastapi/app/.env", required: false }

# Application data links
app_links:
  - { src: ".application/app_files/data_models_layer", dest: ".fastapi/app/physical_layer/data_models_layer", required: false }
  - { src: ".application/app_files/label_structure_layer", dest: ".fastapi/app/physical_layer/label_structure_layer", required: false }
  - { src: ".application/app_files/production_images", dest: ".fastapi/app/physical_layer/production_images", required: false }
  - { src: ".application/app_files/report_images", dest: ".fastapi/app/physical_layer/report_images", required: false }
