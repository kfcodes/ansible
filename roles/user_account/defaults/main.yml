---
managed_users: []

user_account_generate_ssh_keys: false
ssh_keys_to_generate: []

ssh_key_dir: "{{ lookup('env','HOME') }}/.ssh"
ssh_key_type: ed25519
ssh_key_comment: "Managed by Ansible"

# Debian/Ubuntu/Pop!_OS: sudo
# Fedora/Rocky/RHEL: wheel
linux_admin_group: "{{ 'wheel' if ansible_os_family | default('Debian') == 'RedHat' else 'sudo' }}"

user_defaults:
  state: present
  shell: /bin/bash
  create_home: true
  system: false
  password_lock: false
  groups:
    - users
  append_groups: false
  exclusive_keys: true
  passwordless_sudo: false

user_account_sudoers_dir: /etc/sudoers.d
user_account_validate_sudoers: true
