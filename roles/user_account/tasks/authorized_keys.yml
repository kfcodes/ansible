---
- name: Manage inline authorized_keys for users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    state: present
    key: "{{ item.authorized_keys | default([]) | join('\n') }}"
    exclusive: "{{ item.exclusive_keys | default(user_defaults.exclusive_keys) }}"
    manage_dir: true
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.state | default(user_defaults.state) == "present"
    - item.authorized_keys | default([]) | length > 0

- name: Install generated public keys for users
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    state: present
    key: "{{ lookup('file', user_accounts_ssh_key_dir ~ '/' ~ item.1 ~ '.pub') }}"
    exclusive: false
    manage_dir: true
  loop: "{{ managed_users | product(user_accounts_generate_keys) | list }}"
  loop_control:
    label: "{{ item.0.name }} <- {{ item.1 }}.pub"
  when:
    - item.0.state | default(user_defaults.state) == "present"
    - user_accounts_generate_keys | length > 0
