---
- name: Install sudo package on Debian/Ubuntu
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: false
  when: ansible_facts.os_family == "Debian"

- name: Install sudo package on RedHat/Fedora
  ansible.builtin.dnf:
    name: sudo
    state: present
    update_cache: false
  when: ansible_facts.os_family == "RedHat"

- name: Configure passwordless sudo for users that request it
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/99-{{ item.name }}"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.passwordless_sudo | default(user_defaults.passwordless_sudo) | bool
    - item.state | default(user_defaults.state) == "present"

- name: Remove passwordless sudo file for absent users
  ansible.builtin.file:
    path: "/etc/sudoers.d/99-{{ item.name }}"
    state: absent
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.state | default(user_defaults.state) == "absent"
