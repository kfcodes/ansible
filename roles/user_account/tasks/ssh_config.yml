---
- name: Lookup passwd entry for each managed user
  ansible.builtin.getent:
    database: passwd
    key: "{{ item.name }}"
    fail_key: false
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: user_account_passwd_entries

- name: Build user home map
  ansible.builtin.set_fact:
    user_account_home_map: >-
      {{
        user_account_home_map | default({}) |
        combine({ item.item.name: item.ansible_facts.getent_passwd[item.item.name][4] })
      }}
  loop: "{{ user_account_passwd_entries.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.ansible_facts.getent_passwd is defined
    - item.item.name in item.ansible_facts.getent_passwd

- name: Ensure user .ssh directories exist for SSH config
  ansible.builtin.file:
    path: "{{ user_account_home_map[item.name] }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.state | default(user_defaults.state) == "present"
    - user_account_home_map is defined
    - user_account_home_map[item.name] is defined
    - item.create_home | default(user_defaults.create_home) | bool

- name: Render optional user SSH config
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ user_account_home_map[item.name] }}/.ssh/config"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0600"
  loop: "{{ managed_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.state | default(user_defaults.state) == "present"
    - user_account_home_map is defined
    - user_account_home_map[item.name] is defined
    - item.create_home | default(user_defaults.create_home) | bool
