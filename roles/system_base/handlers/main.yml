---
- name: Apply netplan
  ansible.builtin.command: netplan apply
  changed_when: true
  when:
    - system_base_network_backend | default('netplan') == 'netplan'
    - not ansible_check_mode

- name: Reboot System
  ansible.builtin.reboot:
    reboot_timeout: 1000
    pre_reboot_delay: 10
    post_reboot_delay: 30
    test_command: whoami
  when: allow_reboot | default(true) | bool
