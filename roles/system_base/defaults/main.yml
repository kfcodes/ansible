---
# Reboot control
allow_reboot: true

# Package management
system_base_upgrade_packages: true
system_base_package_state: present

# Package lists
# Generic lists apply to every Linux family.
common_system_packages: []
host_system_packages: []
local_system_packages: []
server_system_packages: []
kiosk_system_packages: []
system_base_extra_packages: []

# Debian-family package extras
common_system_packages_debian: []
host_system_packages_debian: []
local_system_packages_debian: []
server_system_packages_debian: []
kiosk_system_packages_debian: []
system_base_extra_packages_debian: []

# RedHat/Fedora/Rocky package extras
common_system_packages_redhat: []
host_system_packages_redhat: []
local_system_packages_redhat: []
server_system_packages_redhat: []
kiosk_system_packages_redhat: []
system_base_extra_packages_redhat: []

# Optional features
system_base_install_neovim: true
system_base_setup_testing_tools: false

# Network/static IP
system_base_manage_static_ip: true
system_base_network_backend: "{{ 'networkmanager' if ansible_os_family | default('Debian') == 'RedHat' else 'netplan' }}"

netplan_config_file: /etc/netplan/01-netcfg.yaml
netplan_backup_file: /etc/netplan/01-netcfg.yaml.bak
