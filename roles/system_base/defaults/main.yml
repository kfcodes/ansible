---
# Reboot control
allow_reboot: true

# Package management
system_base_upgrade_packages: true
system_base_package_state: present

# Package lists are expected from inventory/group_vars/host_vars
host_system_packages: []
local_system_packages: []

# Optional features
system_base_install_neovim: true
system_base_setup_testing_tools: false

# Network/static IP
system_base_manage_static_ip: true
netplan_config_file: /etc/netplan/01-netcfg.yaml
netplan_backup_file: /etc/netplan/01-netcfg.yaml.bak
