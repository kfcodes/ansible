---
- name: Configure static IP with Netplan
  when:
    - ansible_facts.distribution == "Ubuntu"
    - interface_name is defined
    - interface_name | string | length > 0
  block:
    - name: Set interface configuration facts
      ansible.builtin.set_fact:
        net_interface: "{{ interface_name }}"
        net_type: "{{ interface_type | default('ethernet') }}"
        has_static_ip: "{{ static_ip is defined and static_ip is not none and static_ip | string | length > 0 }}"

    - name: Validate required static IP variables when static_ip is set
      ansible.builtin.assert:
        that:
          - netmask is defined
          - gateway is defined
          - dns_servers is defined
          - dns_servers is iterable
        fail_msg: "static_ip requires netmask, gateway, and dns_servers."
      when: has_static_ip | bool

    - name: Check existing Netplan config
      ansible.builtin.stat:
        path: "{{ netplan_config_file }}"
      register: system_base_netplan_config

    - name: Backup original Netplan config when present
      ansible.builtin.copy:
        src: "{{ netplan_config_file }}"
        dest: "{{ netplan_backup_file }}"
        remote_src: true
        force: false
        mode: "0644"
      when: system_base_netplan_config.stat.exists

    - name: Show planned network configuration
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Interface: {{ net_interface }}"
          - "Type: {{ net_type }}"
          - "Static IP enabled: {{ has_static_ip }}"
          - "Static IP: {{ static_ip | default('dhcp') }}"

    - name: Generate Netplan config
      ansible.builtin.template:
        src: netplan.yaml.j2
        dest: "{{ netplan_config_file }}"
        mode: "0644"
      notify: Apply netplan
