---
- name: Update packages on Debian/Ubuntu
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    autoremove: true
    autoclean: true
  register: system_base_update_result
  when:
    - ansible_os_family == "Debian"
    - system_base_upgrade_packages | bool
  notify: Reboot System

- name: Upgrade packages on RedHat/Fedora/Rocky
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  register: system_base_update_result
  when:
    - ansible_os_family == "RedHat"
    - system_base_upgrade_packages | bool
  notify: Reboot System

- name: Select OS-family package lists
  ansible.builtin.set_fact:
    system_base_os_family_packages: >-
      {{
        (
          (common_system_packages_debian | default([]))
          + (host_system_packages_debian | default([]))
          + (local_system_packages_debian | default([]))
          + (server_system_packages_debian | default([]))
          + (kiosk_system_packages_debian | default([]))
          + (system_base_extra_packages_debian | default([]))
        )
        if ansible_os_family == "Debian"
        else
        (
          (common_system_packages_redhat | default([]))
          + (host_system_packages_redhat | default([]))
          + (local_system_packages_redhat | default([]))
          + (server_system_packages_redhat | default([]))
          + (kiosk_system_packages_redhat | default([]))
          + (system_base_extra_packages_redhat | default([]))
        )
        if ansible_os_family == "RedHat"
        else []
      }}

- name: Merge and deduplicate package lists
  ansible.builtin.set_fact:
    system_base_packages_to_install: >-
      {{
        (
          (common_system_packages | default([]))
          + (host_system_packages | default([]))
          + (local_system_packages | default([]))
          + (server_system_packages | default([]))
          + (kiosk_system_packages | default([]))
          + (system_base_extra_packages | default([]))
          + (system_base_os_family_packages | default([]))
        ) | unique | list
      }}

- name: Install base packages
  ansible.builtin.package:
    name: "{{ system_base_packages_to_install }}"
    state: "{{ system_base_package_state }}"
  when: system_base_packages_to_install | length > 0
