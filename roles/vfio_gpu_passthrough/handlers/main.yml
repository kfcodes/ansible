---
- name: update-initramfs
  ansible.builtin.command: update-initramfs -u
  changed_when: true

- name: update-grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: restart-libvirtd
  ansible.builtin.service:
    name: libvirtd
    state: restarted

- name: reboot-host
  ansible.builtin.reboot:
    msg: "Rebooting to apply VFIO/IOMMU configuration"
    reboot_timeout: 900
    pre_reboot_delay: 3
    post_reboot_delay: 10
  when: vfio_allow_reboot | bool
