---
- name: update-initramfs
  ansible.builtin.command: "{{ vfio_initramfs_update_command }}"
  changed_when: true
  when:
    - vfio_run_bootloader_handlers | bool
    - not ansible_check_mode

- name: update-grub
  ansible.builtin.command: "{{ vfio_grub_update_command }}"
  changed_when: true
  when:
    - vfio_run_bootloader_handlers | bool
    - not ansible_check_mode

- name: restart-libvirtd
  ansible.builtin.service:
    name: "{{ vfio_libvirt_service_name }}"
    state: restarted
  when:
    - vfio_manage_libvirt_service | bool
    - not ansible_check_mode

- name: reboot-host
  ansible.builtin.reboot:
    msg: "Rebooting to apply VFIO/IOMMU configuration"
    reboot_timeout: 900
    pre_reboot_delay: 3
    post_reboot_delay: 10
  when:
    - vfio_allow_reboot | bool
    - vfio_run_bootloader_handlers | bool
    - not ansible_check_mode
