---
- name: Install KVM/libvirt packages on Debian/Ubuntu
  ansible.builtin.apt:
    name: "{{ virtualization_packages }}"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Enable and start libvirtd
  ansible.builtin.service:
    name: libvirtd
    state: started
    enabled: true

- name: Ensure libvirt group exists
  ansible.builtin.group:
    name: libvirt
    state: present

- name: Ensure kvm group exists
  ansible.builtin.group:
    name: kvm
    state: present

- name: Add configured users to libvirt and kvm groups
  ansible.builtin.user:
    name: "{{ item }}"
    groups: libvirt,kvm
    append: true
  loop: "{{ vfio_libvirt_users }}"
  loop_control:
    label: "{{ item }}"
  when: vfio_libvirt_users | length > 0
