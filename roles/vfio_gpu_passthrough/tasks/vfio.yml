---
- name: Ensure VFIO modules load at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/vfio.conf
    mode: "0644"
    content: |
      vfio
      vfio_pci
      vfio_iommu_type1
      vfio_virqfd
  notify:
    - update-initramfs

- name: Ensure VFIO modules are included in initramfs on Ubuntu/Debian
  ansible.builtin.blockinfile:
    path: /etc/initramfs-tools/modules
    create: true
    marker: "# {mark} ANSIBLE VFIO MODULES"
    block: |
      vfio
      vfio_pci
      vfio_iommu_type1
      vfio_virqfd
  when: ansible_os_family == "Debian"
  notify:
    - update-initramfs

- name: Configure vfio-pci device IDs
  ansible.builtin.template:
    src: vfio.conf.j2
    dest: /etc/modprobe.d/vfio.conf
    mode: "0644"
  notify:
    - update-initramfs

- name: Optionally blacklist host GPU drivers only in VFIO mode
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-host-gpu.conf
    mode: "0644"
    content: |
      blacklist amdgpu
      blacklist radeon
      blacklist nouveau
      blacklist nvidia
  when:
    - blacklist_host_gpu_drivers | bool
    - vfio_mode == 'vfio'
  notify:
    - update-initramfs

- name: Ensure blacklist file is absent in host mode or when disabled
  ansible.builtin.file:
    path: /etc/modprobe.d/blacklist-host-gpu.conf
    state: absent
  when: (not blacklist_host_gpu_drivers | bool) or (vfio_mode != 'vfio')
  notify:
    - update-initramfs
