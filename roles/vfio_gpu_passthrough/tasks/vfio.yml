---
- name: Ensure VFIO config parent directories exist
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ vfio_modules_load_path }}"
    - "{{ vfio_initramfs_modules_path }}"
    - "{{ vfio_modprobe_conf_path }}"
    - "{{ vfio_blacklist_conf_path }}"

- name: Ensure VFIO modules load at boot
  ansible.builtin.copy:
    dest: "{{ vfio_modules_load_path }}"
    mode: "0644"
    content: |
      vfio
      vfio_pci
      vfio_iommu_type1
      vfio_virqfd
  notify:
    - update-initramfs

- name: Ensure VFIO modules are included in initramfs on Ubuntu/Debian
  ansible.builtin.blockinfile:
    path: "{{ vfio_initramfs_modules_path }}"
    create: true
    marker: "# {mark} ANSIBLE VFIO MODULES"
    block: |
      vfio
      vfio_pci
      vfio_iommu_type1
      vfio_virqfd
  when: vfio_os_family == "Debian"
  notify:
    - update-initramfs

- name: Configure vfio-pci device IDs
  ansible.builtin.template:
    src: vfio.conf.j2
    dest: "{{ vfio_modprobe_conf_path }}"
    mode: "0644"
  notify:
    - update-initramfs

- name: Optionally blacklist host GPU drivers only in VFIO mode
  ansible.builtin.copy:
    dest: "{{ vfio_blacklist_conf_path }}"
    mode: "0644"
    content: |
      blacklist amdgpu
      blacklist radeon
      blacklist nouveau
      blacklist nvidia
  when:
    - blacklist_host_gpu_drivers | bool
    - vfio_mode == 'vfio'
  notify:
    - update-initramfs

- name: Ensure blacklist file is absent in host mode or when disabled
  ansible.builtin.file:
    path: "{{ vfio_blacklist_conf_path }}"
    state: absent
  when: (not blacklist_host_gpu_drivers | bool) or (vfio_mode != 'vfio')
  notify:
    - update-initramfs
