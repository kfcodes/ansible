---
- name: Read /etc/default/grub
  ansible.builtin.slurp:
    path: /etc/default/grub
  register: grub_file

- name: Decode grub file content
  ansible.builtin.set_fact:
    grub_file_text: "{{ grub_file.content | b64decode }}"

- name: Extract current GRUB_CMDLINE_LINUX_DEFAULT
  ansible.builtin.set_fact:
    grub_cmdline_current_str: >-
      {{
        (grub_file_text
          | regex_search('^GRUB_CMDLINE_LINUX_DEFAULT=(".*"|\\x27.*\\x27|[^\\n]*)', multiline=True)
          | default('GRUB_CMDLINE_LINUX_DEFAULT=""'))
        | regex_replace('^GRUB_CMDLINE_LINUX_DEFAULT=', '')
        | trim
        | regex_replace('^"|"$', '')
        | regex_replace("^\\x27|\\x27$", '')
      }}

- name: Split current GRUB cmdline
  ansible.builtin.set_fact:
    grub_cmdline_current: "{{ grub_cmdline_current_str.split(' ') | reject('equalto','') | list }}"

- name: Remove old VFIO and IOMMU managed args
  ansible.builtin.set_fact:
    grub_cmdline_current: >-
      {{
        grub_cmdline_current
        | reject('search','^vfio-pci\\.ids=')
        | reject('equalto','rd.driver.pre=vfio-pci')
        | reject('equalto','modprobe.blacklist=amdgpu')
        | reject('equalto','modprobe.blacklist=snd_hda_intel')
        | reject('equalto','video=efifb:off')
        | reject('equalto','intel_iommu=on')
        | reject('equalto','amd_iommu=on')
        | reject('equalto','iommu=pt')
        | list
      }}

- name: Build platform IOMMU args
  ansible.builtin.set_fact:
    vfio_platform_iommu_args: >-
      {{
        ['iommu=pt', 'intel_iommu=on']
        if iommu_platform == 'intel'
        else ['iommu=pt', 'amd_iommu=on']
