---
# OS support
vfio_os_family: "{{ ansible_facts.get('os_family', 'Debian') }}"
vfio_supported_os_families:
  - Debian
vfio_fail_on_unsupported_os: true
vfio_is_supported_os: "{{ vfio_os_family in vfio_supported_os_families }}"

# Mode:
# - host: keep GPU available to Linux host
# - vfio: bind GPU to vfio-pci at boot for passthrough
vfio_mode: "host"

# Safety switches
vfio_apply_grub: true
vfio_configure_modules: true
vfio_install_packages: true
vfio_install_scripts: true
vfio_install_runtime_scripts: false
vfio_allow_reboot: false
vfio_create_vm: false
vfio_create_demo_vm: false

# Required for real boot/module changes outside check mode.
# This prevents accidental GRUB/initramfs/module edits.
vfio_confirm_boot_changes: false
vfio_boot_changes_requested: "{{ (vfio_apply_grub | bool) or (vfio_configure_modules | bool) }}"
vfio_run_bootloader_handlers: true

# Paths. Override these in tests to avoid touching /etc and /usr/local.
vfio_grub_default_path: /etc/default/grub
vfio_modules_load_path: /etc/modules-load.d/vfio.conf
vfio_initramfs_modules_path: /etc/initramfs-tools/modules
vfio_modprobe_conf_path: /etc/modprobe.d/vfio.conf
vfio_blacklist_conf_path: /etc/modprobe.d/blacklist-host-gpu.conf
vfio_script_install_dir: /usr/local/bin

# Commands
vfio_grub_update_command: update-grub
vfio_initramfs_update_command: update-initramfs -u

# PCI IDs for passthrough GPU + HDMI audio function.
# Format: "dddd:dddd"
gpu_pci_ids:
  - "1002:67ef"
  - "1002:aae0"

# Optional BDFs for status/runtime scripts/demo VM.
# Format: "0000:01:00.0"
gpu_bdf: []

# Platform IOMMU selection: intel or amd
iommu_platform: "intel"

# GRUB args always present
grub_cmdline_always:
  - "iommu=pt"

# VFIO-only GRUB args
grub_cmdline_vfio_only:
  - "vfio-pci.ids={{ gpu_pci_ids | join(',') }}"
  - "rd.driver.pre=vfio-pci"
  - "modprobe.blacklist={{ host_gpu_driver }}"

disable_efi_framebuffer: true
blacklist_host_gpu_drivers: false

virtualization_packages_debian:
  - qemu-system-x86
  - qemu-utils
  - ovmf
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst
  - bridge-utils
  - cpu-checker
  - linux-firmware

virtualization_packages_redhat: []

# Backward-compatible package variable.
virtualization_packages: "{{ virtualization_packages_debian if vfio_os_family == 'Debian' else virtualization_packages_redhat }}"

vfio_libvirt_service_name: libvirtd
vfio_manage_libvirt_service: true
vfio_manage_libvirt_groups: true

# Users to add to libvirt/kvm groups
vfio_libvirt_users: []

# Optional Windows VM creation
create_vm: "{{ vfio_create_vm }}"
vm_name: "win10"
vm_ram_mb: 8192
vm_vcpus: 4
vm_disk_path: "/var/lib/libvirt/images/win10.qcow2"
vm_disk_gb: 80
vm_iso_path: "/var/lib/libvirt/boot/windows.iso"
vm_graphics: "spice"
vm_graphics_listen: "127.0.0.1"

# Optional demo VM creation
create_demo_vm: "{{ vfio_create_demo_vm }}"
demo_vm_name: "alpine-vfio"
demo_iso_url: "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/alpine-standard-3.19.1-x86_64.iso"
demo_iso_dir: "/var/lib/libvirt/boot"
demo_iso_filename: "alpine-standard-3.19.1-x86_64.iso"
demo_iso_path: "{{ demo_iso_dir }}/{{ demo_iso_filename }}"
demo_vm_ram_mb: 2048
demo_vm_vcpus: 2
ovmf_code_path: "/usr/share/OVMF/OVMF_CODE.fd"
ovmf_vars_template_path: "/usr/share/OVMF/OVMF_VARS.fd"
demo_nvram_path: "/var/lib/libvirt/qemu/nvram/{{ demo_vm_name }}_VARS.fd"
demo_enable_x_vga: true

host_gpu_driver: amdgpu
host_audio_driver: snd_hda_intel
