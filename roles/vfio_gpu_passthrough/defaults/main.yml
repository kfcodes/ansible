---
# Mode:
# - host: keep GPU available to Linux host
# - vfio: bind GPU to vfio-pci at boot for passthrough
vfio_mode: "host"

# Safety switches
vfio_apply_grub: true
vfio_configure_modules: true
vfio_install_packages: true
vfio_install_scripts: true
vfio_install_runtime_scripts: false
vfio_allow_reboot: false
vfio_create_vm: false
vfio_create_demo_vm: false

# PCI IDs for passthrough GPU + HDMI audio function.
# Format: "dddd:dddd"
gpu_pci_ids:
  - "1002:67ef"
  - "1002:aae0"

# Optional BDFs for status/runtime scripts/demo VM.
# Format: "0000:01:00.0"
gpu_bdf: []

# Platform IOMMU selection: intel or amd
iommu_platform: "intel"

# GRUB args always present
grub_cmdline_always:
  - "iommu=pt"
  - "intel_iommu=on"

# VFIO-only GRUB args
grub_cmdline_vfio_only:
  - "vfio-pci.ids={{ gpu_pci_ids | join(',') }}"
  - "rd.driver.pre=vfio-pci"
  - "modprobe.blacklist=amdgpu"

disable_efi_framebuffer: true
blacklist_host_gpu_drivers: false

virtualization_packages:
  - qemu-system-x86
  - qemu-utils
  - ovmf
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst
  - bridge-utils
  - cpu-checker
  - linux-firmware

# Users to add to libvirt/kvm groups
vfio_libvirt_users: []

# Optional Windows VM creation
create_vm: "{{ vfio_create_vm }}"
vm_name: "win10"
vm_ram_mb: 8192
vm_vcpus: 4
vm_disk_path: "/var/lib/libvirt/images/win10.qcow2"
vm_disk_gb: 80
vm_iso_path: "/var/lib/libvirt/boot/windows.iso"
vm_graphics: "spice"
vm_graphics_listen: "127.0.0.1"

# Optional demo VM creation
create_demo_vm: "{{ vfio_create_demo_vm }}"
demo_vm_name: "alpine-vfio"
demo_iso_url: "https://dl-cdn.alpinelinux.org/alpine/v3.19/releases/x86_64/alpine-standard-3.19.1-x86_64.iso"
demo_iso_dir: "/var/lib/libvirt/boot"
demo_iso_filename: "alpine-standard-3.19.1-x86_64.iso"
demo_iso_path: "{{ demo_iso_dir }}/{{ demo_iso_filename }}"
demo_vm_ram_mb: 2048
demo_vm_vcpus: 2
ovmf_code_path: "/usr/share/OVMF/OVMF_CODE.fd"
ovmf_vars_template_path: "/usr/share/OVMF/OVMF_VARS.fd"
demo_nvram_path: "/var/lib/libvirt/qemu/nvram/{{ demo_vm_name }}_VARS.fd"
demo_enable_x_vga: true

host_gpu_driver: amdgpu
host_audio_driver: snd_hda_intel
