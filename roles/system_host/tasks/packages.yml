---
- name: Install system host packages on Debian/Ubuntu
  ansible.builtin.apt:
    name: "{{ system_host_packages }}"
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install system host packages on RedHat/Fedora
  ansible.builtin.dnf:
    name: "{{ system_host_packages }}"
    state: present
    update_cache: true
  when: ansible_os_family == "RedHat"
