---
- name: Ensure fail2ban is enabled and started
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: system_host_enable_fail2ban | bool

- name: Ensure unattended-upgrades is enabled where available
  ansible.builtin.service:
    name: unattended-upgrades
    state: started
    enabled: true
  failed_when: false
  when:
    - ansible_os_family == "Debian"
    - system_host_enable_unattended_upgrades | bool
