---
- name: Install Docker through distro packages
  ansible.builtin.include_tasks: docker_distro.yml
  when: system_host_docker_package_method == "distro"

- name: Install Docker through official Docker repository
  ansible.builtin.include_tasks: docker_official_redhat.yml
  when:
    - system_host_docker_package_method == "official"
    - system_host_os_family == "RedHat"

- name: Fail when official Docker method is unsupported for this OS family
  ansible.builtin.fail:
    msg: "system_host_docker_package_method=official is currently implemented for RedHat-family hosts only."
  when:
    - system_host_docker_package_method == "official"
    - system_host_os_family != "RedHat"

- name: Ensure docker group exists
  ansible.builtin.group:
    name: "{{ system_host_docker_group }}"
    state: present

- name: Check Docker user accounts exist
  ansible.builtin.getent:
    database: passwd
    key: "{{ item }}"
    fail_key: false
  loop: "{{ system_host_docker_users }}"
  loop_control:
    label: "{{ item }}"
  register: system_host_docker_user_getent

- name: Add existing users to docker group
  ansible.builtin.user:
    name: "{{ item.item }}"
    groups: "{{ system_host_docker_group }}"
    append: true
  loop: "{{ system_host_docker_user_getent.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.ansible_facts.getent_passwd | default({}) | length > 0

- name: Report skipped Docker users that do not exist
  ansible.builtin.debug:
    msg: "Skipped adding '{{ item.item }}' to {{ system_host_docker_group }} group because the user does not exist."
  loop: "{{ system_host_docker_user_getent.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.ansible_facts.getent_passwd | default({}) | length == 0

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: "{{ system_host_docker_service_name }}"
    state: started
    enabled: true
  when: system_host_manage_docker_service | bool
