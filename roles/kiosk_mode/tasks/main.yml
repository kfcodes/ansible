---
- name: Validate kiosk_mode inputs
  ansible.builtin.import_tasks: validate.yml
  tags: [kiosk, kiosk_mode, validate]

- name: Install kiosk packages
  ansible.builtin.import_tasks: packages.yml
  when:
    - kiosk_mode_enabled | bool
    - kiosk_install_packages | bool
  tags: [kiosk, kiosk_mode, packages]

- name: Configure kiosk autologin
  ansible.builtin.import_tasks: autologin.yml
  when: kiosk_manage_autologin | bool
  tags: [kiosk, kiosk_mode, autologin]

- name: Configure kiosk user session
  ansible.builtin.import_tasks: user_session.yml
  tags: [kiosk, kiosk_mode, session]

- name: Kiosk summary
  ansible.builtin.debug:
    msg:
      - "kiosk_mode_enabled={{ kiosk_mode_enabled }}"
      - "kiosk_user={{ kiosk_user }}"
      - "kiosk_autologin_tty={{ kiosk_autologin_tty }}"
      - "kiosk_url={{ kiosk_url }}"
      - "Reboot recommended after enabling/disabling kiosk autologin."
  tags: [kiosk, kiosk_mode]
