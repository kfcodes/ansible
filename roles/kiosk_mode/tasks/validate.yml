---
- name: Validate supported kiosk OS list
  ansible.builtin.assert:
    that:
      - kiosk_supported_os_families is iterable
      - kiosk_supported_os_families is not string
    fail_msg: "kiosk_supported_os_families must be a list."

- name: Validate kiosk user
  ansible.builtin.assert:
    that:
      - kiosk_user is defined
      - kiosk_user | string | length > 0
    fail_msg: "kiosk_user must be set."

- name: Validate kiosk user home
  ansible.builtin.assert:
    that:
      - kiosk_user_home is defined
      - kiosk_user_home | string | length > 0
      - kiosk_user_home is match('^/')
    fail_msg: "kiosk_user_home must be an absolute path."

- name: Validate autologin TTY
  ansible.builtin.assert:
    that:
      - kiosk_autologin_tty is match('^tty[0-9]+$')
    fail_msg: "kiosk_autologin_tty must look like tty1, tty2, etc."

- name: Validate kiosk URL
  ansible.builtin.assert:
    that:
      - kiosk_url is defined
      - kiosk_url | string | length > 0
    fail_msg: "kiosk_url must be set."

- name: Validate browser flags list
  ansible.builtin.assert:
    that:
      - kiosk_browser_flags is iterable
      - kiosk_browser_flags is not string
    fail_msg: "kiosk_browser_flags must be a list."

- name: Validate package lists
  ansible.builtin.assert:
    that:
      - kiosk_packages is iterable
      - kiosk_packages is not string
      - kiosk_base_packages_debian is iterable
      - kiosk_base_packages_debian is not string
      - kiosk_onboard_packages_debian is iterable
      - kiosk_onboard_packages_debian is not string
      - kiosk_wm_packages_debian is iterable
      - kiosk_wm_packages_debian is not string
      - kiosk_helper_packages_debian is iterable
      - kiosk_helper_packages_debian is not string
      - kiosk_base_packages_redhat is iterable
      - kiosk_base_packages_redhat is not string
      - kiosk_onboard_packages_redhat is iterable
      - kiosk_onboard_packages_redhat is not string
      - kiosk_wm_packages_redhat is iterable
      - kiosk_wm_packages_redhat is not string
      - kiosk_helper_packages_redhat is iterable
      - kiosk_helper_packages_redhat is not string
      - kiosk_extra_packages is iterable
      - kiosk_extra_packages is not string
    fail_msg: "All kiosk package variables must be lists."
