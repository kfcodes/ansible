---
# OS support
kiosk_os_family: "{{ ansible_facts.get('os_family', 'Debian') }}"
kiosk_supported_os_families:
  - Debian

# false = skip safely on unsupported OS families
# true  = fail clearly on unsupported OS families
kiosk_fail_on_unsupported_os: false
kiosk_is_supported_os: "{{ kiosk_os_family in kiosk_supported_os_families }}"

# Enable/disable kiosk behavior.
# true  = configure autologin and kiosk startup
# false = remove the managed autologin override and bash_profile block
kiosk_mode_enabled: true

# User that auto-logs in and runs the kiosk
kiosk_user: "ubuntu"
kiosk_user_home: "/home/{{ kiosk_user }}"
kiosk_user_group: "{{ kiosk_user }}"

# TTY to auto-login
kiosk_autologin_tty: "{{ autologin_tty | default('tty1') }}"

# Whether to manage the getty autologin override
kiosk_manage_autologin: true

# Safer default: do not restart active getty immediately.
# Reboot is usually cleaner for kiosk enablement.
kiosk_restart_getty: false

# Whether to install packages from this role
kiosk_install_packages: true
kiosk_package_install_enabled: true
kiosk_apt_install_recommends: "{{ apt_install_recommends | default(false) }}"

# Kiosk URL
kiosk_url: "https://example.com"

# Window manager
kiosk_window_manager: "matchbox"
kiosk_window_manager_command: "matchbox-window-manager -use_titlebar no -use_dialogs no"

# Browser
kiosk_browser: "{{ browser_choice | default('chromium-browser') }}"

# Browser flags
kiosk_browser_flags:
  - "--kiosk"
  - "--start-fullscreen"
  - "--app={{ kiosk_url }}"
  - "--incognito"
  - "--no-first-run"
  - "--disable-session-crashed-bubble"
  - "--disable-infobars"
  - "--noerrdialogs"
  - "--autoplay-policy=no-user-gesture-required"

# On-screen keyboard and helpers
kiosk_enable_onboard: true
kiosk_enable_unclutter: "{{ enable_unclutter | default(true) }}"
kiosk_disable_screen_blanking: true

# Generic package extensions
kiosk_extra_packages: "{{ extra_packages | default([]) }}"

# Debian/Ubuntu package set
kiosk_base_packages_debian:
  - xorg
  - at-spi2-core
  - "{{ kiosk_browser }}"

kiosk_onboard_packages_debian:
  - onboard
  - onboard-data

kiosk_wm_packages_debian:
  - matchbox-window-manager

kiosk_helper_packages_debian:
  - unclutter

# RedHat/Rocky package set.
# Intentionally empty by default because kiosk display/session setup is Debian-first.
kiosk_base_packages_redhat: []
kiosk_onboard_packages_redhat: []
kiosk_wm_packages_redhat: []
kiosk_helper_packages_redhat: []

# Backward-compatible generic override.
# If set non-empty, this list wins.
kiosk_packages: []

# Managed file paths
kiosk_xinitrc_path: "{{ kiosk_user_home }}/.xinitrc"
kiosk_bash_profile_path: "{{ kiosk_user_home }}/.bash_profile"
