---
- name: Install backup sync packages
  ansible.builtin.package:
    name:
      - "{{ backup_sync_rsync_package }}"
      - "{{ backup_sync_cron_package }}"
    state: present

- name: Enable cron service when available
  ansible.builtin.service:
    name: "{{ backup_sync_cron_service_name }}"
    state: started
    enabled: true
  failed_when: false
  when:
    - backup_sync_manage_cron_service | bool
    - not ansible_check_mode

- name: Report skipped cron service management in check mode
  ansible.builtin.debug:
    msg: "Skipping cron service management in check mode."
  when:
    - backup_sync_manage_cron_service | bool
    - ansible_check_mode
