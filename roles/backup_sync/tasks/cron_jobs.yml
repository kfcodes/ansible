---
- name: Configure backup cron jobs
  ansible.builtin.cron:
    name: "{{ item.name }}"
    user: "{{ item.user | default(backup_cron_user) }}"
    job: >-
      {{ item.job | default(backup_script_dir ~ '/' ~ item.script ~ ' >> /var/log/' ~ (item.script | splitext | first) ~ '.log 2>&1') }}
    special_time: "{{ item.special_time | default(item.schedule | default(omit)) }}"
    minute: "{{ item.minute | default(omit) }}"
    hour: "{{ item.hour | default(omit) }}"
    day: "{{ item.day | default(omit) }}"
    month: "{{ item.month | default(omit) }}"
    weekday: "{{ item.weekday | default(omit) }}"
    state: "{{ item.enabled | default(true) | bool | ternary('present', 'absent') }}"
  loop: "{{ backup_cron_jobs }}"
  loop_control:
    label: "{{ item.name }}"
