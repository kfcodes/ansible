---
- name: Run sync job
  ansible.posix.synchronize:
    src: "{{ backup_sync_job.src }}"
    dest: "{{ backup_sync_job.dest }}"
    mode: "{{ backup_sync_job.mode | default('pull') }}"
    rsync_opts: "{{ backup_sync_job.rsync_opts | default(backup_sync_default_rsync_opts) }}"
    checksum: "{{ backup_sync_job.checksum | default(backup_sync_checksum) }}"
    delete: "{{ backup_sync_job.delete | default(backup_sync_delete) }}"
    links: "{{ backup_sync_job.links | default(backup_sync_links) }}"
    recursive: "{{ backup_sync_job.recursive | default(backup_sync_recursive) }}"
    owner: "{{ backup_sync_job.owner | default(backup_sync_owner) }}"
    group: "{{ backup_sync_job.group | default(backup_sync_group) }}"
    perms: "{{ backup_sync_job.perms | default(backup_sync_perms) }}"
    times: "{{ backup_sync_job.times | default(backup_sync_times) }}"
    ssh_args: "{{ backup_sync_job.ssh_args | default(omit) }}"
  register: backup_sync_result
  failed_when: false
  become: "{{ backup_sync_job.become | default(false) }}"

- name: Report successful sync job
  ansible.builtin.debug:
    msg: "Sync succeeded: {{ backup_sync_job.name }} (src={{ backup_sync_job.src }}, dest={{ backup_sync_job.dest }})"
  when: backup_sync_result.rc | default(0) == 0

- name: Record failed sync job
  ansible.builtin.set_fact:
    backup_sync_failed_jobs: "{{ backup_sync_failed_jobs + [backup_sync_job.name] }}"
  when: backup_sync_result.rc | default(0) != 0

- name: Report failed sync job
  ansible.builtin.debug:
    msg:
      - "Sync failed: {{ backup_sync_job.name }}"
      - "src={{ backup_sync_job.src }}"
      - "dest={{ backup_sync_job.dest }}"
      - "rc={{ backup_sync_result.rc | default('unknown') }}"
      - "{{ backup_sync_result.msg | default('') }}"
  when: backup_sync_result.rc | default(0) != 0
