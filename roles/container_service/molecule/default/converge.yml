---
- name: Converge container_service safely
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  vars:
    molecule_app_root: /tmp/container-service-molecule

  pre_tasks:
    - name: Remove old molecule app root
      ansible.builtin.file:
        path: "{{ molecule_app_root }}"
        state: absent

  tasks:
    - name: Render container service files without touching Docker
      ansible.builtin.include_role:
        name: container_service
      vars:
        service_state: present
        container_service_root_path: "{{ molecule_app_root }}"
        container_service_app_owner: "{{ ansible_user_id }}"
        container_service_app_group: "{{ ansible_user_id }}"
        container_service_manage_app_directory: true
        container_service_manage_repo: false
        container_service_sync_config: false
        container_service_manage_runtime: false
        container_service_run_healthchecks: false
        container_service_manage_dockerfile: true
        container_service_runtime_backend: docker_compose_v2
        container_service_services:
          - name: demoapi
            repo: git@example.invalid/demoapi.git
            version: v1.2.3
            host_port: 18080
            container_port: 8000
            env_files:
              - ./app/env/config.env
            volumes:
              - ./app:/app
            networks:
              - molecule_net
            healthcheck:
              enabled: false
