---
- name: Validate container service collection
  ansible.builtin.import_tasks: preflight.yml
  tags: [validate, containers, deploy]

- name: Deploy configured container services
  ansible.builtin.include_tasks: deploy_one.yml
  loop: "{{ container_service_effective_services }}"
  loop_control:
    loop_var: svc
    label: "{{ svc.name | default((service_name | default('service')) ~ '-' ~ (svc.name_suffix | default('default'))) }}"
  when: container_service_effective_services | length > 0
  tags: [deploy, containers]
