---
- name: Ensure remote env directory exists
  ansible.builtin.file:
    path: "{{ container_service_app_path }}/{{ container_service_remote_env_dir }}"
    state: directory
    owner: "{{ container_service_app_owner }}"
    group: "{{ container_service_app_group }}"
    mode: "0755"

- name: Check local source-of-truth config directory
  ansible.builtin.stat:
    path: "{{ container_service_local_src_dir }}"
  register: local_config_dir
  delegate_to: localhost
  become: false

- name: Fail if required local config directory is missing
  ansible.builtin.fail:
    msg: "Missing local config directory: {{ container_service_local_src_dir }}"
  when:
    - container_service_fail_missing_config | bool
    - not (local_config_dir.stat.exists and local_config_dir.stat.isdir)

- name: Sync local config directory to remote env directory
  ansible.posix.synchronize:
    src: "{{ container_service_local_src_dir }}/"
    dest: "{{ container_service_app_path }}/{{ container_service_remote_env_dir }}/"
    archive: true
    compress: true
    delete: false
  register: config_copy_result
  when:
    - local_config_dir.stat.exists
    - local_config_dir.stat.isdir

- name: Report skipped config sync
  ansible.builtin.debug:
    msg: "Skipped config sync because local directory is missing: {{ container_service_local_src_dir }}"
  when:
    - not container_service_fail_missing_config | bool
    - not (local_config_dir.stat.exists and local_config_dir.stat.isdir)
