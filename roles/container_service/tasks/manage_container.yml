---
- name: Validate runtime backend before managing containers
  ansible.builtin.assert:
    that:
      - container_service_runtime_backend == 'docker_compose_v2'
    fail_msg: "Unsupported container_service_runtime_backend={{ container_service_runtime_backend }}."

- name: Ensure external Docker networks exist
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop: "{{ container_service_networks }}"
  loop_control:
    label: "{{ item }}"
  when:
    - container_service_state == 'present'
    - service_manage_networks | bool
    - container_service_networks | length > 0
    - not ansible_check_mode or container_service_allow_check_mode_runtime | bool

- name: Report skipped Docker network management in check mode
  ansible.builtin.debug:
    msg: "Skipping Docker network management in check mode for {{ app.name }}."
  when:
    - container_service_state == 'present'
    - service_manage_networks | bool
    - container_service_networks | length > 0
    - ansible_check_mode
    - not container_service_allow_check_mode_runtime | bool

- name: Compute whether compose build is needed
  ansible.builtin.set_fact:
    container_service_needs_build: >-
      {{
        (repo_result is defined and repo_result.changed)
        or (compose_template_result is defined and compose_template_result.changed)
        or (dockerfile_template_result is defined and dockerfile_template_result.changed)
      }}
  when: container_service_state == 'present'

- name: Deploy service with Docker Compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ container_service_app_path }}"
    state: present
    pull: "{{ compose_pull }}"
    recreate: "{{ compose_recreate }}"
    remove_orphans: "{{ compose_remove_orphans }}"
    build: "{{ ((compose_build | bool) and (container_service_needs_build | default(false) | bool)) | ternary('always', 'never') }}"
  when:
    - container_service_state == 'present'
    - not ansible_check_mode or container_service_allow_check_mode_runtime | bool

- name: Report skipped Docker Compose deployment in check mode
  ansible.builtin.debug:
    msg: "Skipping Docker Compose deployment in check mode for {{ app.name }}."
  when:
    - container_service_state == 'present'
    - ansible_check_mode
    - not container_service_allow_check_mode_runtime | bool

- name: Check compose project path before removal
  ansible.builtin.stat:
    path: "{{ container_service_app_path }}/docker-compose.yml"
  register: container_service_compose_file
  when: container_service_state == 'absent'

- name: Remove service with Docker Compose v2
  community.docker.docker_compose_v2:
    project_src: "{{ container_service_app_path }}"
    state: absent
    remove_orphans: true
  when:
    - container_service_state == 'absent'
    - container_service_compose_file.stat.exists
    - not ansible_check_mode or container_service_allow_check_mode_runtime | bool

- name: Report skipped Docker Compose removal in check mode
  ansible.builtin.debug:
    msg: "Skipping Docker Compose removal in check mode for {{ app.name }}."
  when:
    - container_service_state == 'absent'
    - container_service_compose_file.stat.exists | default(false)
    - ansible_check_mode
    - not container_service_allow_check_mode_runtime | bool
