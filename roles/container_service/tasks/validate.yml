---
- name: Validate required app configuration
  ansible.builtin.assert:
    that:
      - app is defined
      - app is mapping
      - app.name is defined
      - app.name | string | length > 0
      - app.version is defined
      - app.version | string | length > 0
      - app.ports is iterable
      - app.ports is not string
      - app.volumes is iterable
      - app.volumes is not string
      - app.env_files is iterable
      - app.env_files is not string
      - app.networks is iterable
      - app.networks is not string
      - app.healthcheck is mapping
      - app.base_image is defined
      - app.base_image | string | length > 0
      - app.workdir is defined
      - app.workdir | string | length > 0
      - app.uvicorn_app is defined
      - app.uvicorn_app | string | length > 0
    fail_msg: "container_service: each service requires name, version, list fields for ports/volumes/env_files/networks, healthcheck mapping, base_image, workdir, and uvicorn_app."

- name: Validate required app repository configuration
  ansible.builtin.assert:
    that:
      - app.repo is defined
      - app.repo | string | length > 0
    fail_msg: "container_service: app.repo is required when container_service_manage_repo=true."
  when: container_service_manage_repo | bool

- name: Disallow main/master deployments unless explicitly allowed
  ansible.builtin.assert:
    that:
      - app.version not in ['main', 'master']
    fail_msg: "container_service: app.version must be a stable/update tag, not main/master."
  when: not (svc.allow_main_branch | default(false) | bool)

- name: Validate effective app path is absolute when provided
  ansible.builtin.assert:
    that:
      - app.path | default('') | length == 0 or app.path is match('^/')
    fail_msg: "container_service: app.path must be absolute when provided."
