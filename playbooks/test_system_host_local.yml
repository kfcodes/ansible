---
- name: Test system_host locally
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  vars:
    system_host_packages: []
    system_host_install_docker: false
    system_host_deploy_user: "{{ lookup('env', 'USER') }}"
    system_host_docker_users: []
    system_host_app_root: /tmp/system-host-test-apps

  roles:
    - role: system_host
      tags:
        - system_host
