---
- name: System maintenance
  hosts: managed_linux_hosts
  gather_facts: true
  become: true

  tasks:
    - name: Refresh Debian-family package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts['os_family'] == "Debian"
      tags:
        - maintenance
        - apt
        - packages

    - name: Refresh RedHat-family package cache
      ansible.builtin.command:
        argv:
          - dnf
          - -y
          - makecache
      changed_when: false
      when: ansible_facts['os_family'] == "RedHat"
      tags:
        - maintenance
        - dnf
        - packages

- name: Backup synchronization
  hosts: dev_control_hosts
  gather_facts: true
  become: true

  tasks:
    - name: Run backup sync role
      ansible.builtin.include_role:
        name: backup_sync
        apply:
          tags:
            - backup_sync
            - sync
            - backup
            - cron
            - scripts
      tags:
        - backup_sync
        - sync
        - backup
        - cron
        - scripts
