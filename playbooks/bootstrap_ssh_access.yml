---
- name: Bootstrap prerequisite on controller
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  vars:
    bootstrap_key_name: "{{ deploy_user | default('appuser') }}"
    bootstrap_key_path: "{{ ssh_key_dir | default(lookup('env','HOME') ~ '/.ssh') }}/{{ bootstrap_key_name }}"

  tasks:
    - name: Install sshpass on controller
      ansible.builtin.apt:
        name: sshpass
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Ensure SSH key exists for deploy user
      community.crypto.openssh_keypair:
        path: "{{ bootstrap_key_path }}"
        type: ed25519
        comment: "Managed by Ansible"
        mode: "0600"
      become: false

- name: Bootstrap SSH key access on new hosts
  hosts: "{{ target_hosts | default('secure_hosts') }}"
  gather_facts: false
  become: false

  vars:
    bootstrap_key_name: "{{ deploy_user | default('appuser') }}"
    bootstrap_key_path: "{{ ssh_key_dir | default(lookup('env','HOME') ~ '/.ssh') }}/{{ bootstrap_key_name }}"
    bootstrap_login_user: "{{ bootstrap_user | default('m') }}"

  tasks:
    - name: Install deploy user's public key for bootstrap login user
      ansible.posix.authorized_key:
        user: "{{ bootstrap_login_user }}"
        key: "{{ lookup('file', bootstrap_key_path ~ '.pub') }}"
        state: present
        manage_dir: true

- name: Cleanup on controller
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  tasks:
    - name: Remove sshpass from controller
      ansible.builtin.apt:
        name: sshpass
        state: absent
        autoremove: true
      when: ansible_os_family == "Debian"
