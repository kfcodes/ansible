---
- name: Check platform-aware inventory and role decisions
  hosts: "{{ target_hosts | default('managed_linux_hosts') }}"
  gather_facts: true
  become: false

  tasks:
    - name: Show platform-aware values
      ansible.builtin.debug:
        msg:
          - "inventory_hostname={{ inventory_hostname }}"
          - "ansible_distribution={{ ansible_facts['distribution'] }}"
          - "ansible_distribution_version={{ ansible_facts['distribution_version'] }}"
          - "ansible_os_family={{ ansible_facts['os_family'] }}"
          - "linux_admin_group={{ linux_admin_group }}"
          - "expected_system_base_network_backend={{ 'networkmanager' if ansible_facts['os_family'] == 'RedHat' else 'netplan' }}"
          - "expected_system_security_firewall_backend={{ 'firewalld' if ansible_facts['os_family'] == 'RedHat' else 'ufw' }}"
          - "expected_system_security_ssh_service_name={{ 'sshd' if ansible_facts['os_family'] == 'RedHat' else 'ssh' }}"
          - "expected_system_security_auto_updates_package={{ 'dnf-automatic' if ansible_facts['os_family'] == 'RedHat' else 'unattended-upgrades' }}"
          - "expected_backup_sync_cron_package={{ 'cronie' if ansible_facts['os_family'] == 'RedHat' else 'cron' }}"
          - "expected_backup_sync_cron_service={{ 'crond' if ansible_facts['os_family'] == 'RedHat' else 'cron' }}"
