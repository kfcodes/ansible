---
- name: Ensure UFW package is installed
  ansible.builtin.package:
    name: ufw
    state: present

- name: Allow configured firewall ports
  community.general.ufw:
    rule: "{{ item.rule | default('allow') }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ system_host_firewall_allow_ports }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
