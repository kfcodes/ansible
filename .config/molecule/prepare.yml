---
# Shared prepare step for scenarios that use it
# (provisioner.playbooks.prepare: ${MOLECULE_REPO_ROOT}/.config/molecule/prepare.yml).
# Works on bare images, the systemd images and Vagrant boxes.
- name: Prepare test instance
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Bootstrap python3, sudo and acl if missing
      ansible.builtin.raw: |
        if command -v python3 >/dev/null 2>&1 && command -v sudo >/dev/null 2>&1 && command -v setfacl >/dev/null 2>&1; then
          exit 0
        fi
        if command -v apt-get >/dev/null 2>&1; then
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 sudo acl
        else
          dnf install -y python3 sudo acl
        fi
      # Containers connect as root and have no sudo yet; VMs need sudo.
      become: "{{ ansible_connection not in ['docker', 'community.docker.docker'] }}"
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:

    - name: Wait for systemd to finish booting
      ansible.builtin.command: timeout 90 systemctl is-system-running --wait
      register: molecule_prepare_systemd
      changed_when: false
      failed_when: false
      when: ansible_facts['service_mgr'] == 'systemd'

    - name: Create the test user
      ansible.builtin.user:
        name: "{{ local_usr | default('devtest') }}"
        create_home: true
        shell: /bin/bash
