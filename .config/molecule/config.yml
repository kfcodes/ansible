---
# Shared Molecule settings. Molecule finds this file at the root of the Git
# repository and merges every scenario's molecule.yml on top of it, so a
# scenario only needs to state what is different.
#
# Run scenarios through ./run_molecule.sh: it builds the test images and sets
# MOLECULE_REPO_ROOT, which scenarios use to find shared files.

# Collections come from collections/requirements.yml or ANSIBLE_COLLECTIONS_PATH,
# so Molecule does not download anything itself.
prerun: false
dependency:
  name: galaxy
  enabled: false

# Rocky Linux 10 and Ubuntu 24.04 containers running systemd, so roles can
# install, start and enable services. Images: .config/molecule/images/
driver:
  name: docker
platforms:
  - name: rocky10
    image: molecule-systemd:rocky10
    pre_build_image: true
    command: /usr/sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups: [server, rocky]
  - name: ubuntu2404
    image: molecule-systemd:ubuntu2404
    pre_build_image: true
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups: [server, ubuntu]

provisioner:
  name: ansible
verifier:
  name: ansible
